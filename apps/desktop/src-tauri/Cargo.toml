[package]
name = "givemejob-desktop"
version = "0.1.0"
description = "GiveMeJob desktop application"
authors = ["GiveMeJob contributors"]
edition = "2021"

[lib]
name = "givemejob_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
