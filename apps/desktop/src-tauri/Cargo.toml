[package]
name = "givemejob-desktop"
version = "1.1.0"
description = "GiveMeJob desktop application"
authors = ["GiveMeJob contributors"]
edition = "2021"
default-run = "givemejob-desktop"

[features]
default = []
m2-benchmark = []

[[bin]]
name = "givemejob-desktop"
path = "src/main.rs"

[[bin]]
name = "m2_benchmark"
path = "src/bin/m2_benchmark.rs"
required-features = ["m2-benchmark"]

[lib]
name = "givemejob_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
fs2 = "0.4"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"
zeroize = "1"
zstd = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
] }
