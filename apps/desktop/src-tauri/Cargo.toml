[package]
name = "givemejob-desktop"
version = "0.1.0"
description = "GiveMeJob desktop application"
authors = ["GiveMeJob contributors"]
edition = "2021"

[lib]
name = "givemejob_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
fs2 = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tempfile = "3"
unicode-normalization = "0.1"
zstd = "0.13"
