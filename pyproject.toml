[project]
name = "givemejob"
version = "0.1.0"
description = "Deterministic catalog exporter for the GiveMeJob Windows app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "zstandard>=0.23,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["AGENTS.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["tools.catalog_export"]
