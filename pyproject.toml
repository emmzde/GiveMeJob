[project]
name = "givemejob"
version = "0.1.0"
description = "GiveMeJob backend and ingestion services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "orjson>=3.11,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "redis>=6,<7",
  "sentry-sdk[fastapi]>=2.35,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.7,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["AGENTS.md", "CODEX_KICKOFF.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["services"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentry_sdk.*"]
ignore_missing_imports = true
